services:
  yolo:
    build: ./yolov8_service
    container_name: yolov8
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8501:8501"
    volumes:
      - ./models:/weights
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/docs', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mcp_network
      
  mcp-vision-adapter:
    build:
      context: .
      dockerfile: Dockerfile.adapter
    container_name: mcp-vision-adapter
    restart: unless-stopped
    environment:
      YOLO_SERVICE_URL: http://yolo:8080
      PORT: 3000
      NODE_ENV: production
    depends_on: 
      yolo:
        condition: service_healthy
        restart: true
    ports: 
      - "3000:3000"
    volumes:
      - ./test.jpg:/app/test.jpg
      - ./mcp_vision_adapter:/app/mcp_vision_adapter
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mcp_network

networks:
  mcp_network:
    driver: bridge
    name: mcp_network
